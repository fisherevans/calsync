<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="10" y="10" width="880" height="410" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ===================== MASK ROW ===================== -->
  <text x="50" y="52" font-size="17" font-weight="700" fill="#bf8700">MASK<tspan font-size="13" font-weight="400" fill="#57606a">  copy events as opaque, padded busy blocks</tspan></text>

  <!-- source -->
  <text x="68" y="84" font-size="12" font-weight="600" fill="#57606a" letter-spacing="0.5">PERSONAL CALENDAR</text>
  <rect x="50" y="94" width="240" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="50" y="94" width="5" height="74" rx="2.5" fill="#d29922"/>
  <text x="70" y="126" font-size="15" font-weight="600" fill="#24292f">Dentist appointment</text>
  <text x="70" y="148" font-size="12" fill="#57606a">Tue  2:00 - 3:00 PM</text>

  <!-- arrow -->
  <line x1="298" y1="131" x2="562" y2="131" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="119" width="68" height="24" rx="12" fill="#bf8700"/>
  <text x="430" y="135" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">mask</text>
  <text x="430" y="160" font-size="11" fill="#57606a" text-anchor="middle">+20 min buffer, details dropped</text>

  <!-- target -->
  <text x="588" y="84" font-size="12" font-weight="600" fill="#57606a" letter-spacing="0.5">WORK CALENDAR</text>
  <rect x="570" y="94" width="260" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="570" y="94" width="5" height="74" rx="2.5" fill="#8b949e"/>
  <text x="590" y="126" font-size="15" font-weight="600" fill="#24292f">Busy</text>
  <text x="590" y="148" font-size="12" fill="#57606a">Tue  1:40 - 3:20 PM</text>

  <!-- divider -->
  <line x1="50" y1="214" x2="830" y2="214" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===================== MIRROR ROW ===================== -->
  <text x="50" y="262" font-size="17" font-weight="700" fill="#1f6feb">MIRROR<tspan font-size="13" font-weight="400" fill="#57606a">  copy titles (and join links) across</tspan></text>

  <!-- source -->
  <text x="68" y="294" font-size="12" font-weight="600" fill="#57606a" letter-spacing="0.5">WORK CALENDAR</text>
  <rect x="50" y="304" width="240" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="50" y="304" width="5" height="74" rx="2.5" fill="#1f6feb"/>
  <text x="70" y="336" font-size="15" font-weight="600" fill="#24292f">Team Standup</text>
  <text x="70" y="358" font-size="12" fill="#57606a">Mon  10:00 - 10:15 AM  &#183; zoom</text>

  <!-- arrow -->
  <line x1="298" y1="341" x2="562" y2="341" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="329" width="76" height="24" rx="12" fill="#1f6feb"/>
  <text x="430" y="345" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">mirror</text>
  <text x="430" y="370" font-size="11" fill="#57606a" text-anchor="middle">title + join link copied</text>

  <!-- target -->
  <text x="588" y="294" font-size="12" font-weight="600" fill="#57606a" letter-spacing="0.5">PERSONAL CALENDAR</text>
  <rect x="570" y="304" width="260" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="570" y="304" width="5" height="74" rx="2.5" fill="#1f6feb"/>
  <text x="590" y="336" font-size="15" font-weight="600" fill="#24292f">Team Standup</text>
  <text x="590" y="358" font-size="12" fill="#57606a">Mon  10:00 - 10:15 AM  &#183; join</text>
</svg>
